services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bible_universe
      POSTGRES_USER: bible
      POSTGRES_PASSWORD: bible
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bible_universe_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bible -d bible_universe"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bible:bible@db:5432/bible_universe
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev -- --hostname 0.0.0.0

volumes:
  bible_universe_pgdata:
